[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-spatial-trace-cuda"
version = "1.0.0"
description = "Evidence-first Bitcoin UTXO trace mapping with UGTS export and CUDA analytics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "torch>=2.7",
  "matplotlib>=3.8",
  "reportlab>=4.0",
  "requests>=2.31",
]

[project.scripts]
bitcoin-spatial-trace = "spatial_trace.cli:main"

[tool.setuptools]
packages = ["spatial_trace"]

[tool.setuptools.package-data]
spatial_trace = ["templates/*"]
