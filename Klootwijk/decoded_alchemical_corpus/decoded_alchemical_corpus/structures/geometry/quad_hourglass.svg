<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>Quad hourglass routing</title>
<defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0b2a3c"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f9aaa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".16"/>
    </filter>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0b2a3c; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #5c6770; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #5c6770; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
      .box { stroke: #0b2a3c; stroke-width: 2.2; rx: 18; ry: 18; }
    </style>
    </defs>
<text x="55" y="55" class="title" text-anchor="start">Quad hourglass as a routing diagram</text>
<text x="55" y="88" class="subtitle" text-anchor="start">Four compatibility chambers meet at a rank-changing event locus. The form is a computational partition, not a proven physical topology.</text>
<polygon points="180,130 520,130 600,370 180,330" fill="#dff3f4" stroke="#0b2a3c" stroke-width="3"/>
<text x="370.0" y="235.0" class="label" text-anchor="middle">A0</text>
<text x="370.0" y="265.0" class="small" text-anchor="middle">sheet 0 / route A</text>
<polygon points="680,130 1020,130 1020,330 600,370" fill="#fbf3d5" stroke="#0b2a3c" stroke-width="3"/>
<text x="830.0" y="235.0" class="label" text-anchor="middle">B0</text>
<text x="830.0" y="265.0" class="small" text-anchor="middle">sheet 0 / route B</text>
<polygon points="180,410 600,370 520,610 180,610" fill="#ece9f6" stroke="#0b2a3c" stroke-width="3"/>
<text x="370.0" y="495.0" class="label" text-anchor="middle">A1</text>
<text x="370.0" y="525.0" class="small" text-anchor="middle">sheet 1 / route A</text>
<polygon points="600,370 1020,410 1020,610 680,610" fill="#e4f3ed" stroke="#0b2a3c" stroke-width="3"/>
<text x="830.0" y="495.0" class="label" text-anchor="middle">B1</text>
<text x="830.0" y="525.0" class="small" text-anchor="middle">sheet 1 / route B</text>
<line x1="600" y1="115" x2="600" y2="625" stroke="#d86b5b" stroke-width="4" opacity="1"/>
<text x="620" y="145" class="body" text-anchor="start">invariant axis</text>
<circle cx="600" cy="370" r="28" fill="#d86b5b" stroke="#0b2a3c" stroke-width="3"/>
<text x="600" y="375" class="mono" text-anchor="middle" fill="#ffffff">B=0</text>
<text x="600" y="670" class="body" text-anchor="middle">At the pinch: solve event → apply transition → possibly toggle parity p → preserve lineage.</text>
<polyline points="300,230 500,290 570,350" fill="none" stroke="#1f9aaa" stroke-width="5" marker-end="url(#arrow)"/>
<polyline points="630,390 740,470 900,520" fill="none" stroke="#3f9b7a" stroke-width="5" marker-end="url(#arrow)"/>
</svg>