<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>Double vacuum as phase-separated co-location</title>
<defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0b2a3c"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f9aaa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".16"/>
    </filter>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0b2a3c; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #5c6770; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #5c6770; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
      .box { stroke: #0b2a3c; stroke-width: 2.2; rx: 18; ry: 18; }
    </style>
    </defs>
<text x="55" y="55" class="title" text-anchor="start">Double vacuum decoded as relational exclusion</text>
<text x="55" y="88" class="subtitle" text-anchor="start">Two states may share a spatial coordinate yet fail to couple because phase, sheet, orientation or lineage tags are incompatible.</text>
<polygon points="150,230 940,160 1080,230 290,300" fill="#dff3f4" stroke="#0b2a3c" stroke-width="3" opacity=".92"/>
<text x="180" y="222" class="label" text-anchor="start">Sheet A</text>
<text x="180" y="252" class="mono" text-anchor="start">σ = 0</text>
<polygon points="150,470 940,400 1080,470 290,540" fill="#ece9f6" stroke="#0b2a3c" stroke-width="3" opacity=".92"/>
<text x="180" y="462" class="label" text-anchor="start">Sheet B</text>
<text x="180" y="492" class="mono" text-anchor="start">σ = 1</text>
<circle cx="620" cy="230" r="22" fill="#1f9aaa" stroke="#0b2a3c" stroke-width="3"/>
<text x="652" y="236" class="mono" text-anchor="start">same x</text>
<circle cx="620" cy="470" r="22" fill="#7667a8" stroke="#0b2a3c" stroke-width="3"/>
<text x="652" y="476" class="mono" text-anchor="start">same x</text>
<line x1="620" y1="252" x2="620" y2="448" stroke="#d86b5b" stroke-width="3" stroke-dasharray="8,8" opacity="1"/>
<text x="640" y="355" class="label" text-anchor="start" fill="#d86b5b">no coupling</text>
<rect x="840" y="300" width="250" height="90" rx="18" fill="#fbf3d5" stroke="#d7a72e" stroke-width="2.2" />
<text x="965" y="335" class="label" text-anchor="middle">Compatibility gate</text>
<text x="965" y="367" class="mono" text-anchor="middle">χ(A,B,t) = 1 ?</text>
<polyline points="650,230 760,230 840,325" fill="none" stroke="#1f9aaa" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="650,470 760,470 840,365" fill="none" stroke="#7667a8" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="965" y1="390" x2="965" y2="455" stroke="#3f9b7a" stroke-width="4" marker-end="url(#arrow)" opacity="1"/>
<text x="995" y="435" class="body" text-anchor="start">couple only on pass</text>
<text x="55" y="650" class="small" text-anchor="start">Not a second physical vacuum. It is an absence of interaction in a shared state space.</text>
</svg>