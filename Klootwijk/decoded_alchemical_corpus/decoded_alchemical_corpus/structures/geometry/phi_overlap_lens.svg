<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>Phi overlap lens</title>
<defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0b2a3c"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f9aaa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".16"/>
    </filter>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0b2a3c; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #5c6770; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #5c6770; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
      .box { stroke: #0b2a3c; stroke-width: 2.2; rx: 18; ry: 18; }
    </style>
    </defs>
<text x="55" y="55" class="title" text-anchor="start">The slight overlap decoded</text>
<text x="55" y="88" class="subtitle" text-anchor="start">Two folded φ/D-like lobes produce a lens-shaped intersection. The overlap can represent shared domain, tolerance, or interference - not a unique physical law.</text>
<circle cx="480" cy="360" r="220" fill="#dff3f4" fill-opacity=".75" stroke="#1f9aaa" stroke-width="4"/>
<circle cx="720" cy="360" r="220" fill="#fbf3d5" fill-opacity=".72" stroke="#d7a72e" stroke-width="4"/>
<line x1="600" y1="110" x2="600" y2="610" stroke="#0b2a3c" stroke-width="5" opacity="1"/>
<text x="600" y="640" class="body" text-anchor="middle">shared stem / hinge</text>
<text x="380" y="360" class="title" text-anchor="middle">A</text>
<text x="820" y="360" class="title" text-anchor="middle">B</text>
<text x="600" y="350" class="label" text-anchor="middle">A ∩ B</text>
<text x="600" y="382" class="body" text-anchor="middle">shared domain</text>
<rect x="930" y="150" width="230" height="80" rx="18" fill="#ffffff" stroke="#0b2a3c" stroke-width="2.2" />
<text x="955" y="180" class="label" text-anchor="start">Geometry</text>
<text x="955" y="208" class="small" text-anchor="start">lens / vesica intersection</text>
<rect x="930" y="250" width="230" height="80" rx="18" fill="#ffffff" stroke="#0b2a3c" stroke-width="2.2" />
<text x="955" y="280" class="label" text-anchor="start">Information</text>
<text x="955" y="308" class="small" text-anchor="start">mutual information or common domain</text>
<rect x="930" y="350" width="230" height="80" rx="18" fill="#ffffff" stroke="#0b2a3c" stroke-width="2.2" />
<text x="955" y="380" class="label" text-anchor="start">Mechanics</text>
<text x="955" y="408" class="small" text-anchor="start">clearance / tolerance / phase slip</text>
<rect x="930" y="450" width="230" height="80" rx="18" fill="#ffffff" stroke="#0b2a3c" stroke-width="2.2" />
<text x="955" y="480" class="label" text-anchor="start">Waves</text>
<text x="955" y="508" class="small" text-anchor="start">local interference region</text>
</svg>