<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>Equation-world pipeline</title>
<defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0b2a3c"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f9aaa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".16"/>
    </filter>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0b2a3c; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #5c6770; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #5c6770; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
      .box { stroke: #0b2a3c; stroke-width: 2.2; rx: 18; ry: 18; }
    </style>
    </defs>
<text x="60" y="58" class="title" text-anchor="start">Equation-world decoder</text>
<text x="60" y="90" class="subtitle" text-anchor="start">The mature corpus is a queryable state-and-event calculus, not a hidden renderer.</text>
<rect x="55" y="145" width="160" height="82" rx="18" fill="#dff3f4" stroke="#0b2a3c" stroke-width="2.2" />
<text x="135.0" y="179" class="label" text-anchor="middle">Finite grammar</text>
<text x="135.0" y="207" class="mono" text-anchor="middle">G + seed</text>
<rect x="260" y="145" width="180" height="82" rx="18" fill="#eef2f4" stroke="#0b2a3c" stroke-width="2.2" />
<text x="350.0" y="179" class="label" text-anchor="middle">State evaluator</text>
<text x="350.0" y="207" class="mono" text-anchor="middle">q(t)</text>
<rect x="485" y="125" width="175" height="62" rx="18" fill="#fbf3d5" stroke="#0b2a3c" stroke-width="2.2" />
<text x="572.5" y="159" class="label" text-anchor="middle">Local support</text>
<text x="572.5" y="187" class="mono" text-anchor="middle">C(q,t) ≤ 0</text>
<rect x="485" y="205" width="175" height="62" rx="18" fill="#ece9f6" stroke="#0b2a3c" stroke-width="2.2" />
<text x="572.5" y="239" class="label" text-anchor="middle">Compatibility</text>
<text x="572.5" y="267" class="mono" text-anchor="middle">χ ∈ {0,1}</text>
<rect x="700" y="145" width="170" height="82" rx="18" fill="#f8e4e0" stroke="#0b2a3c" stroke-width="2.2" />
<text x="785.0" y="179" class="label" text-anchor="middle">Event solver</text>
<text x="785.0" y="207" class="mono" text-anchor="middle">R(q)=0 → t*</text>
<rect x="915" y="145" width="180" height="82" rx="18" fill="#e4f3ed" stroke="#0b2a3c" stroke-width="2.2" />
<text x="1005.0" y="179" class="label" text-anchor="middle">Transition</text>
<text x="1005.0" y="207" class="mono" text-anchor="middle">T(q-, context)</text>
<line x1="215" y1="186" x2="260" y2="186" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="440" y1="186" x2="485" y2="156" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="440" y1="186" x2="485" y2="236" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="660" y1="156" x2="700" y2="176" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="660" y1="236" x2="700" y2="196" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="870" y1="186" x2="915" y2="186" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<rect x="260" y="340" width="835" height="112" rx="18" fill="#eef2f4" stroke="#0b2a3c" stroke-width="2.2" />
<text x="285" y="375" class="label" text-anchor="start">Persistent state</text>
<text x="285" y="408" class="body" text-anchor="start">lineage address + invariants + branch history + exogenous novelty log</text>
<line x1="1005" y1="227" x2="1005" y2="340" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<polyline points="1005,452 1005,500 350,500 350,452" fill="none" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="55" y="535" width="1040" height="110" rx="18" fill="#ffffff" stroke="#0b2a3c" stroke-width="2.2" />
<text x="85" y="572" class="label" text-anchor="start">Direct query outputs</text>
<rect x="85" y="590" width="145" height="38" rx="10" fill="#dff3f4" stroke="#1f9aaa" stroke-width="2.2" />
<text x="157.5" y="615" class="mono" text-anchor="middle">state_at(t)</text>
<rect x="248" y="590" width="145" height="38" rx="10" fill="#dff3f4" stroke="#1f9aaa" stroke-width="2.2" />
<text x="320.5" y="615" class="mono" text-anchor="middle">next_event</text>
<rect x="411" y="590" width="185" height="38" rx="10" fill="#dff3f4" stroke="#1f9aaa" stroke-width="2.2" />
<text x="503.5" y="615" class="mono" text-anchor="middle">events_in_support</text>
<rect x="614" y="590" width="145" height="38" rx="10" fill="#dff3f4" stroke="#1f9aaa" stroke-width="2.2" />
<text x="686.5" y="615" class="mono" text-anchor="middle">coupling</text>
<rect x="777" y="590" width="145" height="38" rx="10" fill="#dff3f4" stroke="#1f9aaa" stroke-width="2.2" />
<text x="849.5" y="615" class="mono" text-anchor="middle">identity</text>
<rect x="940" y="590" width="145" height="38" rx="10" fill="#dff3f4" stroke="#1f9aaa" stroke-width="2.2" />
<text x="1012.5" y="615" class="mono" text-anchor="middle">agent action</text>
</svg>