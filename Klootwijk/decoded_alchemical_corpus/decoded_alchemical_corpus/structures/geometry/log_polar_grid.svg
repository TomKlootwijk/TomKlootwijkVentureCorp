<text x="445" y="370" class="small" text-anchor="start">origin</text>
<rect x="760" y="160" width="360" height="360" rx="18" fill="#ffffff" stroke="#0b2a3c" stroke-width="2.2" />
<text x="940" y="205" class="label" text-anchor="middle">Coordinate map</text>
<text x="940" y="260" class="mono" text-anchor="middle">r = √(x² + y²)</text>
<text x="940" y="310" class="mono" text-anchor="middle">ρ = ln(r / r₀)</text>
<text x="940" y="360" class="mono" text-anchor="middle">θ = atan2(y, x)</text>
<text x="940" y="425" class="mono" text-anchor="middle">scale r → a r</text>
<text x="940" y="465" class="mono" text-anchor="middle">becomes ρ → ρ + ln a</text>
<text x="760" y="590" class="small" text-anchor="start">Source use: log-encoded polar LUTs, radial/angular support, chromatic offsets.</text>
</svg>