<text x="55" y="55" class="title" text-anchor="start">Reaction-diffusion: the source's real field-theory anchor</text>
<text x="55" y="88" class="subtitle" text-anchor="start">Local reactions plus spatial diffusion can create stable fronts, spots and stripes.</text>
