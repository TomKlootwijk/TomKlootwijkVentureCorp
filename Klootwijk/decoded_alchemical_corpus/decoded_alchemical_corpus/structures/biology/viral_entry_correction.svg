<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>Viral entry correction</title>
<defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0b2a3c"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f9aaa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".16"/>
    </filter>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0b2a3c; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #5c6770; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #5c6770; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
      .box { stroke: #0b2a3c; stroke-width: 2.2; rx: 18; ry: 18; }
    </style>
    </defs>
<text x="55" y="55" class="title" text-anchor="start">Viral-entry correction</text>
<text x="55" y="88" class="subtitle" text-anchor="start">The source's 'spike punctures the cell wall' phrasing is not a valid model for human cells.</text>
<line x1="100" y1="420" x2="1100" y2="420" stroke="#1f9aaa" stroke-width="10" opacity="1"/>
<text x="110" y="455" class="body" text-anchor="start">host-cell membrane (not a cell wall)</text>
<rect x="650" y="310" width="100" height="110" rx="12" fill="#e4f3ed" stroke="#3f9b7a" stroke-width="2.2" />
<text x="700" y="365" class="label" text-anchor="middle">ACE2</text>
<circle cx="430" cy="250" r="95" fill="#f8e4e0" stroke="#d86b5b" stroke-width="4"/>
<line x1="525.0" y1="250.0" x2="560.0" y2="250.0" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="512.2724133595217" y1="297.5" x2="542.5833024919771" y2="315.0" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="477.5" y1="332.2724133595217" x2="495.0" y2="362.583302491977" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="430.0" y1="345.0" x2="430.0" y2="380.0" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="382.5" y1="332.2724133595217" x2="365.0" y2="362.58330249197707" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="347.7275866404783" y1="297.5" x2="317.41669750802293" y2="315.0" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="335.0" y1="250.0" x2="300.0" y2="250.00000000000003" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="347.7275866404783" y1="202.50000000000003" x2="317.41669750802293" y2="185.00000000000006" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="382.49999999999994" y1="167.72758664047836" x2="364.99999999999994" y2="137.416697508023" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="430.0" y1="155.0" x2="430.0" y2="120.0" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="477.5" y1="167.72758664047834" x2="495.0" y2="137.416697508023" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<line x1="512.2724133595217" y1="202.49999999999994" x2="542.583302491977" y2="184.99999999999994" stroke="#d86b5b" stroke-width="5" opacity="1"/>
<text x="430" y="255" class="label" text-anchor="middle">virion</text>
<polyline points="525,270 600,310 650,330" fill="none" stroke="#d86b5b" stroke-width="5" marker-end="url(#arrow)"/>
<text x="575" y="260" class="small" text-anchor="middle">spike binds receptor</text>
<rect x="785" y="340" width="145" height="80" rx="12" fill="#fbf3d5" stroke="#d7a72e" stroke-width="2.2" />
<text x="858" y="375" class="label" text-anchor="middle">TMPRSS2</text>
<text x="858" y="402" class="small" text-anchor="middle">protease priming</text>
<polyline points="700,420 700,500 520,535" fill="none" stroke="#7667a8" stroke-width="5" marker-end="url(#arrow)"/>
<text x="740" y="500" class="body" text-anchor="start">fusion / endocytic routes</text>
<text x="600" y="640" class="small" text-anchor="middle">Mechanism shown is a high-level SARS-CoV-2 example; exact entry depends on virus, cell type and proteases.</text>
</svg>