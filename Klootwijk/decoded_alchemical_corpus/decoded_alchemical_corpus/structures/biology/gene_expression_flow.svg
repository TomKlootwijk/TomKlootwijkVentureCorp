<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>Gene expression flow</title>
<defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0b2a3c"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f9aaa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".16"/>
    </filter>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0b2a3c; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #5c6770; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #5c6770; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
      .box { stroke: #0b2a3c; stroke-width: 2.2; rx: 18; ry: 18; }
    </style>
    </defs>
<text x="55" y="55" class="title" text-anchor="start">Gene expression as a biochemical information flow</text>
<text x="55" y="88" class="subtitle" text-anchor="start">A real biological counterpart to the corpus's 'grammar → transition → output' metaphor.</text>
<rect x="90" y="230" width="220" height="120" rx="18" fill="#dff3f4" stroke="#0b2a3c" stroke-width="2.2" />
<text x="200.0" y="275" class="label" text-anchor="middle">DNA</text>
<text x="200.0" y="310" class="small" text-anchor="middle">sequence + chromatin</text>
<rect x="390" y="230" width="220" height="120" rx="18" fill="#fbf3d5" stroke="#0b2a3c" stroke-width="2.2" />
<text x="500.0" y="275" class="label" text-anchor="middle">RNA</text>
<text x="500.0" y="310" class="small" text-anchor="middle">transcription + processing</text>
<rect x="690" y="230" width="220" height="120" rx="18" fill="#ece9f6" stroke="#0b2a3c" stroke-width="2.2" />
<text x="800.0" y="275" class="label" text-anchor="middle">Protein</text>
<text x="800.0" y="310" class="small" text-anchor="middle">translation + folding</text>
<rect x="970" y="230" width="170" height="120" rx="18" fill="#e4f3ed" stroke="#0b2a3c" stroke-width="2.2" />
<text x="1055.0" y="275" class="label" text-anchor="middle">Phenotype</text>
<text x="1055.0" y="310" class="small" text-anchor="middle">function / state</text>
<line x1="310" y1="290" x2="390" y2="290" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="610" y1="290" x2="690" y2="290" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="910" y1="290" x2="970" y2="290" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<rect x="330" y="440" width="540" height="120" rx="18" fill="#ffffff" stroke="#0b2a3c" stroke-width="2.2" />
<text x="600" y="475" class="label" text-anchor="middle">Regulatory chemistry</text>
<text x="600" y="510" class="body" text-anchor="middle">transcription factors · RNA turnover · ribosomes · post-translational modification · degradation</text>
<polyline points="600,440 600,390 500,350" fill="none" stroke="#d86b5b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="650,440 750,350" fill="none" stroke="#d86b5b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="625" class="small" text-anchor="middle">No document supplies a gene sequence, kinetic constants, or a validated phase-control therapy.</text>
</svg>