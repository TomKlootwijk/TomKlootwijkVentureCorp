<text x="55" y="55" class="title" text-anchor="start">Blood plasma: fluid-domain representation, not a new chemistry</text>
<text x="55" y="88" class="subtitle" text-anchor="start">The corpus's 'tethering' language can be translated into a flow model with boundaries, sources, sinks and measurement guards.</text>
