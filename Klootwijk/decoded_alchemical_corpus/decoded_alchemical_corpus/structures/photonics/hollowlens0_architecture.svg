<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>Hollowlens-0 architecture</title>
<defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0b2a3c"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f9aaa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".16"/>
    </filter>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0b2a3c; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #5c6770; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #5c6770; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
      .box { stroke: #0b2a3c; stroke-width: 2.2; rx: 18; ry: 18; }
    </style>
    </defs>
<text x="55" y="55" class="title" text-anchor="start">Hollowlens-0 bounded optofluidic demonstrator</text>
<text x="55" y="88" class="subtitle" text-anchor="start">The most technically grounded hardware path in the corpus.</text>
<rect x="55" y="220" width="170" height="130" rx="18" fill="#fbf3d5" stroke="#0b2a3c" stroke-width="2.2" filter="url(#shadow)"/>
<text x="140.0" y="268" class="label" text-anchor="middle">Angular source</text>
<text x="140.0" y="304" class="mono" text-anchor="middle">θ, φ, λ, pol.</text>
<rect x="265" y="220" width="190" height="130" rx="18" fill="#dff3f4" stroke="#0b2a3c" stroke-width="2.2" filter="url(#shadow)"/>
<text x="360.0" y="268" class="label" text-anchor="middle">Liquid coupler</text>
<text x="360.0" y="304" class="mono" text-anchor="middle">curvature / n_eff</text>
<rect x="495" y="220" width="190" height="130" rx="18" fill="#ece9f6" stroke="#0b2a3c" stroke-width="2.2" filter="url(#shadow)"/>
<text x="590.0" y="268" class="label" text-anchor="middle">2×2 MZI</text>
<text x="590.0" y="304" class="mono" text-anchor="middle">phase / interference</text>
<rect x="725" y="220" width="190" height="130" rx="18" fill="#e4f3ed" stroke="#0b2a3c" stroke-width="2.2" filter="url(#shadow)"/>
<text x="820.0" y="268" class="label" text-anchor="middle">Balanced PD</text>
<text x="820.0" y="304" class="mono" text-anchor="middle">y₁, y₂</text>
<rect x="955" y="220" width="190" height="130" rx="18" fill="#f8e4e0" stroke="#0b2a3c" stroke-width="2.2" filter="url(#shadow)"/>
<text x="1050.0" y="268" class="label" text-anchor="middle">FPGA / MCU</text>
<text x="1050.0" y="304" class="mono" text-anchor="middle">B.C.E. + log</text>
<line x1="225" y1="285" x2="265" y2="285" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="455" y1="285" x2="495" y2="285" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="685" y1="285" x2="725" y2="285" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="915" y1="285" x2="955" y2="285" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<polyline points="1050,350 1050,500 360,500 360,350" fill="none" stroke="#d86b5b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="700" y="535" class="body" text-anchor="middle">calibration / tuning feedback</text>
<rect x="175" y="590" width="850" height="75" rx="18" fill="#ffffff" stroke="#0b2a3c" stroke-width="2.2" />
<text x="600" y="620" class="mono" text-anchor="middle">Verified event = in support ∧ compatible mode ∧ measured guard crossing ∧ confidence ≥ threshold</text>
<text x="600" y="650" class="small" text-anchor="middle">Report loss, energy, latency, miss/false rate, drift and calibration.</text>
</svg>