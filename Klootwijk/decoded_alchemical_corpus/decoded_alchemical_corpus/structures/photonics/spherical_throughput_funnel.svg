<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img">
<title>Spherical throughput</title>
<defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#0b2a3c"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f9aaa"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".16"/>
    </filter>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #0b2a3c; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #5c6770; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #5c6770; }
      .mono { font-family: "DejaVu Sans Mono", monospace; font-size: 17px; }
      .box { stroke: #0b2a3c; stroke-width: 2.2; rx: 18; ry: 18; }
    </style>
    </defs>
<text x="55" y="55" class="title" text-anchor="start">Spherical throughput is a verified-event rate</text>
<text x="55" y="88" class="subtitle" text-anchor="start">Counting raw photons or detector pulses is insufficient; every gate and the error budget must be included.</text>
<rect x="70" y="180" width="210" height="140" rx="18" fill="#eef2f4" stroke="#0b2a3c" stroke-width="2.2" />
<text x="175.0" y="222" class="label" text-anchor="middle">Inputs</text>
<text x="175.0" y="295" class="title" text-anchor="middle">10,000</text>
<rect x="340" y="210" width="190" height="110" rx="18" fill="#dff3f4" stroke="#0b2a3c" stroke-width="2.2" />
<text x="435.0" y="252" class="label" text-anchor="middle">In support</text>
<text x="435.0" y="295" class="title" text-anchor="middle">1,000</text>
<rect x="590" y="235" width="180" height="85" rx="18" fill="#fbf3d5" stroke="#0b2a3c" stroke-width="2.2" />
<text x="680.0" y="277" class="label" text-anchor="middle">Compatible</text>
<text x="680.0" y="295" class="title" text-anchor="middle">100</text>
<rect x="830" y="250" width="230" height="70" rx="18" fill="#e4f3ed" stroke="#0b2a3c" stroke-width="2.2" />
<text x="945.0" y="292" class="label" text-anchor="middle">Verified B.C.E.</text>
<text x="945.0" y="295" class="title" text-anchor="middle">80</text>
<line x1="280" y1="250" x2="340" y2="250" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="530" y1="265" x2="590" y2="265" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<line x1="770" y1="277" x2="830" y2="277" stroke="#0b2a3c" stroke-width="3" marker-end="url(#arrow)" opacity="1"/>
<rect x="175" y="410" width="850" height="160" rx="18" fill="#ffffff" stroke="#0b2a3c" stroke-width="2.2" />
<text x="600" y="450" class="title" text-anchor="middle">Θ_sph = N_verified / Δt</text>
<text x="600" y="495" class="mono" text-anchor="middle">N_verified = Σ 1[support] · 1[compatibility] · 1[guard crossed] · 1[confidence ≥ c_min]</text>
<text x="600" y="535" class="body" text-anchor="middle">Also report events/J, route accuracy, tail latency, missed/false events, insertion loss and drift.</text>
</svg>