<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#103044"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#103044" flood-opacity=".16"/></filter>
    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">ASML / lithography: event-native augmentation</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">Change control, optimization and provenance - not the physical creation of EUV light, mirrors, stages or resist chemistry</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><rect x="510" y="250" width="580" height="330" rx="32" fill="#f3f7f8" stroke="#103044" stroke-width="4"/><text x="800" y="315" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#103044" text-anchor="middle"><tspan x="800" dy="0">EUV / High-NA exposure tool</tspan></text><text x="800" y="375" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="800" dy="0">source + mirrors + reticle + projection optics</tspan><tspan x="800" dy="28">wafer stage + metrology + resist/process</tspan></text><text x="800" y="520" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2b9a68" text-anchor="middle"><tspan x="800" dy="0">RETAIN: physical imaging and manufacturing chain</tspan></text><rect x="70" y="230" width="360" height="210" rx="24" fill="#e0f3f2" stroke="#169796" stroke-width="3"/><text x="250" y="288" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="250" dy="0">Local hotspot support</tspan></text><text x="250" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="250" dy="0">Only solve mask/wafer regions</tspan><tspan x="250" dy="21">with declared relevance</tspan></text><line x1="430" y1="335" x2="505" y2="335" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="70" y="520" width="360" height="210" rx="24" fill="#fff4d8" stroke="#e5ad28" stroke-width="3"/><text x="250" y="578" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="250" dy="0">Next-fault chamber twin</tspan></text><text x="250" y="625" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="250" dy="0">Guard crossings for thermal,</tspan><tspan x="250" dy="21">pressure, contamination states</tspan></text><line x1="430" y1="625" x2="505" y2="625" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="1130" y="230" width="360" height="210" rx="24" fill="#eeeaf7" stroke="#7162a5" stroke-width="3"/><text x="1310" y="288" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1310" dy="0">OPC / SMO branch lineage</tspan></text><text x="1310" y="335" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1310" dy="0">Every transform, model and</tspan><tspan x="1310" dy="21">recipe keeps provenance</tspan></text><line x1="1130" y1="335" x2="1095" y2="335" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="1130" y="520" width="360" height="210" rx="24" fill="#fde9e5" stroke="#de6a5b" stroke-width="3"/><text x="1310" y="578" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1310" dy="0">Event-native metrology</tspan></text><text x="1310" y="625" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1310" dy="0">Threshold, uncertainty and</tspan><tspan x="1310" dy="21">calibration events - not raw traffic</tspan></text><line x1="1130" y1="625" x2="1095" y2="625" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><text x="800" y="770" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#de6a5b" text-anchor="middle"><tspan x="800" dy="0">Kill criterion: if locality, calibration and solver costs do not beat the full reference at equal wafer outcome, retain the baseline.</tspan></text></svg>