e</tspan></text><text x="215" y="580" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="215" dy="0">Map corpus operators to an external system</tspan></text><text x="1465" y="569" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667985" text-anchor="end"><tspan x="1465" dy="0">FHIR event graph, EPCIS lineage, Open311 SLA</tspan></text><circle cx="120" cy="660" r="38" fill="#2b9a68" stroke="none" stroke-width="3"/><text x="120" y="672" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="120" dy="0">1</tspan></text><rect x="185" y="625" width="1310" height="82" rx="18" fill="#e4f3eb" stroke="#2b9a68" stroke-width="2"/><text x="215" y="657" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="start"><tspan x="215" dy="0">Established component / standard</tspan></text><text x="215" y="685" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="215" dy="0">External precedent, not system validation</tspan></text><text x="1465" y="674" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667985" text-anchor="end"><tspan x="1465" dy="0">MRI physics, EUV toolchain, smart-grid standards</tspan></text><circle cx="120" cy="765" r="38" fill="#103044" stroke="none" stroke-width="3"/><text x="120" y="777" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="120" dy="0">0</tspan></text><rect x="185" y="730" width="1310" height="82" rx="18" fill="#f3f7f8" stroke="#103044" stroke-width="2"/><text x="215" y="762" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="start"><tspan x="215" dy="0">Corpus canonical operator</tspan></text><text x="215" y="790" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="215" dy="0">Source-defined architecture</tspan></text><text x="1465" y="779" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667985" text-anchor="end"><tspan x="1465" dy="0">support + compatibility + guard + lineage</tspan></text></svg>