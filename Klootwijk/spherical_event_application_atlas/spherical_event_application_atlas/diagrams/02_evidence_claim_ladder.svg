    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">Evidence and claim ladder</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">Keep invention ambitious while making status explicit</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><circle cx="120" cy="240" r="38" fill="#de6a5b" stroke="none" stroke-width="3"/><text x="120" y="252" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="120" dy="0">5</tspan></text><rect x="185" y="205" width="1310" height="82" rx="18" fill="#fde9e5" stroke="#de6a5b" stroke-width="2"/><text x="215" y="237" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="start"><tspan x="215" dy="0">Unsupported totalizing claim</tspan></text><text x="215" y="265" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="215" dy="0">Do not present as enabled</tspan></text><text x="1465" y="254" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#667985" text-anchor="end"><tspan x="1465" dy="0">Universal O(1), zero heat, medical control</tspan></text><circle cx="120" cy="345" r="38" fill="#e5ad28" stroke="none" stroke-width="3"/><text x="120" y="357" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="120" dy="0">4</tspan></text><rect x="185" y="310" width="1310" height="82" rx="18" fill="#fff4d8" stroke="#e5ad28" stroke-width="2"/><text x="215" y="342" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="start