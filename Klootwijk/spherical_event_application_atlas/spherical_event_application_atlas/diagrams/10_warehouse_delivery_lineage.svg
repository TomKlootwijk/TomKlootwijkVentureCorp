<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#103044"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#103044" flood-opacity=".16"/></filter>
    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">Warehouse and delivery optimization as event lineage</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">Items, containers, tasks, vehicles and custody changes are explicit relations - not inferred from stale coordinates</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><rect x="55" y="265" width="210" height="175" rx="24" fill="#e0f3f2" stroke="#169796" stroke-width="3"/><text x="160" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="160" dy="0">Inbound</tspan></text><text x="160" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="160" dy="0">identity + conditioneceipt event</tspan></text><line x1="265" y1="350" x2="302" y2="350" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="310" y="265" width="210" height="175" rx="24" fill="#fff4d8" stroke="#e5ad28" stroke-width="3"/><text x="415" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="415" dy="0">Put-away</tspan></text><text x="415" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="415" dy="0">zone support +	ask compatibility</tspan></text><line x1="520" y1="350" x2="557" y2="350" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="565" y="265" width="210" height="175" rx="24" fill="#eeeaf7" stroke="#7162a5" stroke-width="3"/><text x="670" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="670" dy="0">Pick</tspan></text><text x="670" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="670" dy="0">continuous motion +</tspan><tspan x="670" dy="20">collision guards</tspan></text><line x1="775" y1="350" x2="812" y2="350" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="820" y="265" width="210" height="175" rx="24" fill="#e4f3eb" stroke="#2b9a68" stroke-width="3"/><text x="925" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="925" dy="0">Pack</tspan></text><text x="925" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="925" dy="0">component lineage +</tspan><tspan x="925" dy="20">quality event</tspan></text><line x1="1030" y1="350" x2="1067" y2="350" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="1075" y="265" width="210" height="175" rx="24" fill="#fde9e5" stroke="#de6a5b" stroke-width="3"/><text x="1180" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1180" dy="0">Load</tspan></text><text x="1180" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1180" dy="0">vehicle/route/capacity</tspan><tspan x="1180" dy="20">compatibility</tspan></text><line x1="1285" y1="350" x2="1322" y2="350" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="1330" y="265" width="210" height="175" rx="24" fill="#f3f7f8" stroke="#103044" stroke-width="3"/><text x="1435" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1435" dy="0">Deliver</tspan></text><text x="1435" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1435" dy="0">proof / exception /</tspan><tspan x="1435" dy="20">absence event</tspan></text><line x1="140" y1="610" x2="1460" y2="610" stroke="#103044" stroke-width="5"/><circle cx="160" cy="610" r="48" fill="#ffffff" stroke="#169796" stroke-width="4"/><text x="160" y="618" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="160" dy="0">item</tspan></text><circle cx="410" cy="610" r="48" fill="#ffffff" stroke="#169796" stroke-width="4"/><text x="410" y="618" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="410" dy="0">case</tspan></text><circle cx="660" cy="610" r="48" fill="#ffffff" stroke="#169796" stroke-width="4"/><text x="660" y="618" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="660" dy="0">pallet</tspan></text><circle cx="910" cy="610" r="48" fill="#ffffff" stroke="#169796" stroke-width="4"/><text x="910" y="618" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="910" dy="0">vehicle</tspan></text><circle cx="1160" cy="610" r="48" fill="#ffffff" stroke="#169796" stroke-width="4"/><text x="1160" y="618" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1160" dy="0">handoff</tspan></text><circle cx="1410" cy="610" r="48" fill="#ffffff" stroke="#169796" stroke-width="4"/><text x="1410" y="618" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1410" dy="0">recipient</tspan></text><text x="800" y="735" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="800" dy="0">Lineage records splits, merges, substitutions and custody - while ExpectedEvent/AbsenceEvent distinguishes late, missing and unobserved.</tspan></text></svg>