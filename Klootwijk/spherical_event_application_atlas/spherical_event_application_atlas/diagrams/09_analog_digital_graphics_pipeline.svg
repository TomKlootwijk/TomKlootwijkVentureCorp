<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#103044"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#103044" flood-opacity=".16"/></filter>
    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">Digital pipeline: from analog change to direct event semantics</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">Reduce conversion and materialization where possible; keep dense numerical methods when they remain the right solver</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><rect x="45" y="250" width="275" height="215" rx="24" fill="#e4f3eb" stroke="#2b9a68" stroke-width="3"/><text x="182" y="310" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="182" dy="0">Analog phenomenon</tspan></text><text x="182" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="182" dy="0">continuous field / signal</tspan></text><line x1="320" y1="355" x2="347" y2="355" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="355" y="250" width="275" height="215" rx="24" fill="#e0f3f2" stroke="#169796" stroke-width="3"/><text x="492" y="310" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="492" dy="0">Support-aware front end</tspan></text><text x="492" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="492" dy="0">aperture / event sensor /</tspan><tspan x="492" dy="21">level crossing / mode filter</tspan></text><line x1="630" y1="355" x2="657" y2="355" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="665" y="250" width="275" height="215" rx="24" fill="#fff4d8" stroke="#e5ad28" stroke-width="3"/><text x="802" y="310" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="802" dy="0">Typed event stream</tspan></text><text x="802" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="802" dy="0">timestamp + uncertainty +</tspan><tspan x="802" dy="21">coverage + lineage</tspan></text><line x1="940" y1="355" x2="967" y2="355" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="975" y="250" width="275" height="215" rx="24" fill="#eeeaf7" stroke="#7162a5" stroke-width="3"/><text x="1112" y="310" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1112" dy="0">Queryable state</tspan></text><text x="1112" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1112" dy="0">state_at / next_event /</tspan><tspan x="1112" dy="21">can_couple / absence</tspan></text><line x1="1250" y1="355" x2="1277" y2="355" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="1285" y="250" width="275" height="215" rx="24" fill="#f3f7f8" stroke="#103044" stroke-width="3"/><text x="1422" y="310" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1422" dy="0">Optional materialization</tspan></text><text x="1422" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1422" dy="0">raster / volume / dashboard /</tspan><tspan x="1422" dy="21">matrix solve / archive</tspan></text><g filter="url(#shadow)"><rect x="85" y="565" width="430" height="155" rx="24" fill="#e0f3f2" stroke="#169796" stroke-width="2"/></g><rect x="85" y="565" width="12" height="155" rx="12" fill="#169796" stroke="#169796" stroke-width="0"/><text x="113" y="607" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="113" dy="0">Bypass candidates</tspan></text><text x="113" y="643" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="113" dy="0">uniform frame polling</tspan><tspan x="113" dy="21">full image before narrow decision</tspan><tspan x="113" dy="21">square-grid conversion where change events suffice</tspan></text><g filter="url(#shadow)"><rect x="585" y="565" width="430" height="155" rx="24" fill="#fff4d8" stroke="#e5ad28" stroke-width="2"/></g><rect x="585" y="565" width="12" height="155" rx="12" fill="#e5ad28" stroke="#e5ad28" stroke-width="0"/><text x="613" y="607" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="613" dy="0">Hybrid candidates</tspan></text><text x="613" y="643" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="613" dy="0">structured/sparse solverseduced-order models</tspan><tspan x="613" dy="21">photonic transfer kernels with digital sidecar</tspan></text><g filter="url(#shadow)"><rect x="1085" y="565" width="430" height="155" rx="24" fill="#fde9e5" stroke="#de6a5b" stroke-width="2"/></g><rect x="1085" y="565" width="12" height="155" rx="12" fill="#de6a5b" stroke="#de6a5b" stroke-width="0"/><text x="1113" y="607" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="1113" dy="0">Retain when necessary</tspan></text><text x="1113" y="643" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="1113" dy="0">global PDE coupling</tspan><tspan x="1113" dy="21">dense inverse problems</tspan><tspan x="1113" dy="21">uncertain, degenerate or high-event-density regimes</tspan></text><text x="800" y="810" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="800" dy="0">The target is less unnecessary materialization - not the elimination of linear algebra, ADCs or graphics.</tspan></text></svg>