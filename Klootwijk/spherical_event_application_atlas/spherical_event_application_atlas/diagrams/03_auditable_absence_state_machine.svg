<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#103044"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#103044" flood-opacity=".16"/></filter>
    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">Auditable absence and the missing-presence problem</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">Absence is a positive record with obligations and coverage - not a blank database cell</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><rect x="55" y="260" width="205" height="180" rx="24" fill="#e0f3f2" stroke="#169796" stroke-width="3"/><text x="157" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="157" dy="0">Expectation exists</tspan></text><text x="157" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="157" dy="0">Who/what is due?</tspan><tspan x="157" dy="20">Under which authority?</tspan></text><line x1="260" y1="350" x2="302" y2="350" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="310" y="260" width="205" height="180" rx="24" fill="#fff4d8" stroke="#e5ad28" stroke-width="3"/><text x="412" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="412" dy="0">Support valid</tspan></text><text x="412" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="412" dy="0">Correct person, place,</tspan><tspan x="412" dy="20">pathway and interval?</tspan></text><line x1="515" y1="350" x2="557" y2="350" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="565" y="260" width="205" height="180" rx="24" fill="#eeeaf7" stroke="#7162a5" stroke-width="3"/><text x="667" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="667" dy="0">Coverage valid</tspan></text><text x="667" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="667" dy="0">Sensors/channels healthy</tspan><tspan x="667" dy="20">for declared interval?</tspan></text><line x1="770" y1="350" x2="812" y2="350" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="820" y="260" width="205" height="180" rx="24" fill="#e0f3f2" stroke="#169796" stroke-width="3"/><text x="922" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="922" dy="0">Compatible event?</tspan></text><text x="922" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="922" dy="0">Consent, mode, policy,</tspan><tspan x="922" dy="20">identity and reason codes</tspan></text><line x1="1025" y1="350" x2="1067" y2="350" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="1075" y="260" width="205" height="180" rx="24" fill="#fde9e5" stroke="#de6a5b" stroke-width="3"/><text x="1177" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1177" dy="0">Interval closes</tspan></text><text x="1177" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1177" dy="0">No matching verified event</tspan><tspan x="1177" dy="20">and no valid exception</tspan></text><line x1="1280" y1="350" x2="1322" y2="350" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="1330" y="260" width="205" height="180" rx="24" fill="#e4f3eb" stroke="#2b9a68" stroke-width="3"/><text x="1432" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1432" dy="0">Emit AbsenceEvent</tspan></text><text x="1432" y="355" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1432" dy="0">Evidence, confidence,</tspan><tspan x="1432" dy="20">predicate version, lineage</tspan></text><g filter="url(#shadow)"><rect x="145" y="560" width="400" height="165" rx="24" fill="#fde9e5" stroke="#de6a5b" stroke-width="2"/></g><rect x="145" y="560" width="12" height="165" rx="12" fill="#de6a5b" stroke="#de6a5b" stroke-width="0"/><text x="173" y="602" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="173" dy="0">Do not emit absence</tspan></text><text x="173" y="638" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="173" dy="0">No expectation</tspan><tspan x="173" dy="21">Incomplete observation coverage</tspan><tspan x="173" dy="21">Opt-out, transfer or valid exception</tspan></text><g filter="url(#shadow)"><rect x="600" y="560" width="400" height="165" rx="24" fill="#fff4d8" stroke="#e5ad28" stroke-width="2"/></g><rect x="600" y="560" width="12" height="165" rx="12" fill="#e5ad28" stroke="#e5ad28" stroke-width="0"/><text x="628" y="602" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="628" dy="0">Emit UNKNOWN</tspan></text><text x="628" y="638" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="628" dy="0">Telemetry gap</tspan><tspan x="628" dy="21">Ambiguous identity</tspan><tspan x="628" dy="21">Predicate version unavailable</tspan></text><g filter="url(#shadow)"><rect x="1055" y="560" width="400" height="165" rx="24" fill="#e4f3eb" stroke="#2b9a68" stroke-width="2"/></g><rect x="1055" y="560" width="12" height="165" rx="12" fill="#2b9a68" stroke="#2b9a68" stroke-width="0"/><text x="1083" y="602" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="1083" dy="0">Emit ABSENT</tspan></text><text x="1083" y="638" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="1083" dy="0">Obligation + coverage + closed interval</tspan><tspan x="1083" dy="21">No compatible event</tspan><tspan x="1083" dy="21">No exception</tspan></text><text x="800" y="820" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="800" dy="0">The architecture logs the absence of a required presence without confusing it with absence of observation.</tspan></text></svg>