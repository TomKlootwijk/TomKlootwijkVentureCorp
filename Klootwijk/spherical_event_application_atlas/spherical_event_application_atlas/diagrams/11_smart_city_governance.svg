<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#103044"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#103044" flood-opacity=".16"/></filter>
    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">Rights-preserving smart city and municipal governance</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">A city query substrate should make authority, privacy, service obligations and uncertainty as explicit as geometry</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><circle cx="800" cy="440" r="120" fill="#103044" stroke="none" stroke-width="3"/><text x="800" y="425" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan x="800" dy="0">Municipal</tspan></text><text x="800" y="465" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle"><tspan x="800" dy="0">event substrate</tspan></text><circle cx="250" cy="250" r="125" fill="#e0f3f2" stroke="#169796" stroke-width="4"/><text x="250" y="232" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="250" dy="0">Mobility</tspan></text><text x="250" y="278" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="250" dy="0">traffic / curb / transit</tspan><tspan x="250" dy="20">support and transitions</tspan></text><line x1="375" y1="250" x2="680" y2="440" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><circle cx="250" cy="630" r="125" fill="#fff4d8" stroke="#e5ad28" stroke-width="4"/><text x="250" y="612" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="250" dy="0">Public works</tspan></text><text x="250" y="658" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="250" dy="0">water / waste / roads</tspan><tspan x="250" dy="20">maintenance obligations</tspan></text><line x1="375" y1="630" x2="680" y2="440" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><circle cx="1350" cy="250" r="125" fill="#e4f3eb" stroke="#2b9a68" stroke-width="4"/><text x="1350" y="232" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1350" dy="0">Environment</tspan></text><text x="1350" y="278" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1350" dy="0">air / heat / flood</tspan><tspan x="1350" dy="20">sensor coverage and alerts</tspan></text><line x1="1225" y1="250" x2="920" y2="440" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><circle cx="1350" cy="630" r="125" fill="#eeeaf7" stroke="#7162a5" stroke-width="4"/><text x="1350" y="612" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1350" dy="0">Civic services</tspan></text><text x="1350" y="658" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1350" dy="0">Open311 requests</tspan><tspan x="1350" dy="20">SLA absence events</tspan></text><line x1="1225" y1="630" x2="920" y2="440" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="400" y="710" width="800" height="105" rx="22" fill="#fde9e5" stroke="#de6a5b" stroke-width="3"/><text x="800" y="752" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="800" dy="0">Governance boundary</tspan></text><text x="800" y="786" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="800" dy="0">purpose limitation | access predicate | appeal | retention | public audit</tspan></text><text x="800" y="190" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="800" dy="0">Compatibility is also law and legitimacy: who may join which data, for what purpose, for how long?</tspan></text></svg>