<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#103044"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#103044" flood-opacity=".16"/></filter>
    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">MRI: additions, partial bypasses and frontier instruments</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">The event calculus changes acquisition and state semantics; it does not abolish MR physics or safety</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><rect x="55" y="265" width="255" height="165" rx="24" fill="#e4f3eb" stroke="#2b9a68" stroke-width="3"/><text x="182" y="315" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="182" dy="0">B0 + gradients + RF</tspan></text><text x="182" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="182" dy="0">Signal generation</tspan><tspan x="182" dy="21">and spatial encoding</tspan></text><line x1="310" y1="347" x2="347" y2="347" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="355" y="265" width="255" height="165" rx="24" fill="#e4f3eb" stroke="#2b9a68" stroke-width="3"/><text x="482" y="315" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="482" dy="0">Coils + ADC</tspan></text><text x="482" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="482" dy="0">Measured MR signal</tspan><tspan x="482" dy="21">with noise and timing</tspan></text><line x1="610" y1="347" x2="647" y2="347" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="655" y="265" width="255" height="165" rx="24" fill="#e0f3f2" stroke="#169796" stroke-width="3"/><text x="782" y="315" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="782" dy="0">Query controller</tspan></text><text x="782" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="782" dy="0">support + safety +</tspan><tspan x="782" dy="21">information guard</tspan></text><line x1="910" y1="347" x2="947" y2="347" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="955" y="265" width="255" height="165" rx="24" fill="#fff4d8" stroke="#e5ad28" stroke-width="3"/><text x="1082" y="315" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1082" dy="0">Direct output</tspan></text><text x="1082" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1082" dy="0">parameter / event /</tspan><tspan x="1082" dy="21">uncertainty</tspan></text><line x1="1210" y1="347" x2="1247" y2="347" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><rect x="1255" y="265" width="255" height="165" rx="24" fill="#f3f7f8" stroke="#103044" stroke-width="3"/><text x="1382" y="315" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1382" dy="0">Optional image</tspan></text><text x="1382" y="355" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1382" dy="0">clinical materialized</tspan><tspan x="1382" dy="21">view</tspan></text><g filter="url(#shadow)"><rect x="70" y="545" width="440" height="170" rx="24" fill="#e0f3f2" stroke="#169796" stroke-width="2"/></g><rect x="70" y="545" width="12" height="170" rx="12" fill="#169796" stroke="#169796" stroke-width="0"/><text x="98" y="587" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="98" dy="0">Near-term addition</tspan></text><text x="98" y="623" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="98" dy="0">Adaptive sequence orchestration</tspan><tspan x="98" dy="21">Motion/physiology event gating</tspan><tspan x="98" dy="21">Raw-data replay before prospective trials</tspan></text><g filter="url(#shadow)"><rect x="580" y="545" width="440" height="170" rx="24" fill="#fff4d8" stroke="#e5ad28" stroke-width="2"/></g><rect x="580" y="545" width="12" height="170" rx="12" fill="#e5ad28" stroke="#e5ad28" stroke-width="0"/><text x="608" y="587" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="608" dy="0">Bounded partial bypass</tspan></text><text x="608" y="623" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="608" dy="0">Quantitative parameter query</tspan><tspan x="608" dy="21">Task-first reconstruction</tspan><tspan x="608" dy="21">Images retained for review and uncertainty</tspan></text><g filter="url(#shadow)"><rect x="1090" y="545" width="440" height="170" rx="24" fill="#eeeaf7" stroke="#7162a5" stroke-width="2"/></g><rect x="1090" y="545" width="12" height="170" rx="12" fill="#7162a5" stroke="#7162a5" stroke-width="0"/><text x="1118" y="587" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="1118" dy="0">Frontier replacement</tspan></text><text x="1118" y="623" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="1118" dy="0">Narrow task-specific MR instrument</tspan><tspan x="1118" dy="21">Only if it matches clinical task, safety, error</tspan><tspan x="1118" dy="21">and end-to-end events per joule</tspan></text><text x="800" y="810" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#de6a5b" text-anchor="middle"><tspan x="800" dy="0">Never infer negative anatomy from missing acquisition support.</tspan></text></svg>