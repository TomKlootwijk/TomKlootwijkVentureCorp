<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#103044"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#103044" flood-opacity=".16"/></filter>
    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">Benchmark stack: throughput means verified outcomes at a declared boundary</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">Do not count propagation rhetoric, raw detector traffic or unpriced compute as system advantage</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><rect x="475.0" y="205" width="650" height="75" rx="18" fill="#e4f3eb" stroke="#2b9a68" stroke-width="2"/><text x="220" y="252" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#2b9a68" text-anchor="start"><tspan x="220" dy="0">Outcome</tspan></text><text x="450" y="252" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203746" text-anchor="start"><tspan x="450" dy="0">task utility / correctness / safety</tspan></text><rect x="415.0" y="305" width="770" height="75" rx="18" fill="#e0f3f2" stroke="#169796" stroke-width="2"/><text x="220" y="352" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#169796" text-anchor="start"><tspan x="220" dy="0">Verification</tspan></text><text x="450" y="352" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203746" text-anchor="start"><tspan x="450" dy="0">support + compatibility + guard + confidence</tspan></text><rect x="355.0" y="405" width="890" height="75" rx="18" fill="#fff4d8" stroke="#e5ad28" stroke-width="2"/><text x="220" y="452" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#e5ad28" text-anchor="start"><tspan x="220" dy="0">Throughput</tspan></text><text x="450" y="452" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203746" text-anchor="start"><tspan x="450" dy="0">verified events / second</tspan></text><rect x="295.0" y="505" width="1010" height="75" rx="18" fill="#eeeaf7" stroke="#7162a5" stroke-width="2"/><text x="220" y="552" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#7162a5" text-anchor="start"><tspan x="220" dy="0">Energy</tspan></text><text x="450" y="552" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203746" text-anchor="start"><tspan x="450" dy="0">verified events / joule - full system boundary</tspan></text><rect x="235.0" y="605" width="1130" height="75" rx="18" fill="#fde9e5" stroke="#de6a5b" stroke-width="2"/><text x="220" y="652" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#de6a5b" text-anchor="start"><tspan x="220" dy="0">Reliability</tspan></text><text x="450" y="652" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203746" text-anchor="start"><tspan x="450" dy="0">miss / false / tail latency / drift / calibration</tspan></text><rect x="175.0" y="705" width="1250" height="75" rx="18" fill="#f3f7f8" stroke="#103044" stroke-width="2"/><text x="220" y="752" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#103044" text-anchor="start"><tspan x="220" dy="0">Externality</tspan></text><text x="450" y="752" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203746" text-anchor="start"><tspan x="450" dy="0">carbon / fuel / labor / privacy / equity / waste</tspan></text><text x="800" y="840" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="800" dy="0">Every application must beat a matched baseline at equal error, uncertainty and safety - or it remains a useful negative result.</tspan></text></svg>