<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#103044"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#103044" flood-opacity=".16"/></filter>
    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">Cradle-to-life health journey as a consented event and lineage graph</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">A person is not a snapshot; care episodes, measurements, decisions and absences remain linked without becoming the person</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><circle cx="155" cy="355" r="80" fill="#eeeaf7" stroke="#7162a5" stroke-width="4"/><text x="155" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="155" dy="0">Pregnancy</tspan></text><text x="155" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="155" dy="0">maternal + fetal</tspan><tspan x="155" dy="19">lineages</tspan></text><line x1="235" y1="355" x2="305" y2="355" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><circle cx="410" cy="355" r="80" fill="#fde9e5" stroke="#de6a5b" stroke-width="4"/><text x="410" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="410" dy="0">Birth</tspan></text><text x="410" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="410" dy="0">identity link +</tspan><tspan x="410" dy="19">handoff events</tspan></text><line x1="490" y1="355" x2="560" y2="355" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><circle cx="665" cy="355" r="80" fill="#e0f3f2" stroke="#169796" stroke-width="4"/><text x="665" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="665" dy="0">Childhood</tspan></text><text x="665" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="665" dy="0">vaccines / growth /</tspan><tspan x="665" dy="19">screening obligations</tspan></text><line x1="745" y1="355" x2="815" y2="355" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><circle cx="920" cy="355" r="80" fill="#fff4d8" stroke="#e5ad28" stroke-width="4"/><text x="920" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="920" dy="0">Adulthood</tspan></text><text x="920" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="920" dy="0">primary / specialty /</tspan><tspan x="920" dy="19">mental health contexts</tspan></text><line x1="1000" y1="355" x2="1070" y2="355" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><circle cx="1175" cy="355" r="80" fill="#e4f3eb" stroke="#2b9a68" stroke-width="4"/><text x="1175" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1175" dy="0">Aging</tspan></text><text x="1175" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1175" dy="0">medication / function /</tspan><tspan x="1175" dy="19">home-care transitions</tspan></text><line x1="1255" y1="355" x2="1325" y2="355" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><circle cx="1430" cy="355" r="80" fill="#f3f7f8" stroke="#103044" stroke-width="4"/><text x="1430" y="340" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1430" dy="0">Legacy</tspan></text><text x="1430" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1430" dy="0">research consent /ecords retention</tspan></text><path d="M155 470 C 300 560, 430 560, 575 470 C 720 380, 850 380, 995 470 C 1140 560, 1270 560, 1415 470" stroke="#169796" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="620" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#103044" text-anchor="middle"><tspan x="800" dy="0">Shared substrate</tspan></text><text x="800" y="660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="800" dy="0">FHIR-compatible events  |  provenance graph  |  consent and purpose compatibility  |  ExpectedEvent / AbsenceEvent</tspan></text><g filter="url(#shadow)"><rect x="135" y="715" width="420" height="110" rx="24" fill="#fde9e5" stroke="#de6a5b" stroke-width="2"/></g><rect x="135" y="715" width="12" height="110" rx="12" fill="#de6a5b" stroke="#de6a5b" stroke-width="0"/><text x="163" y="757" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="163" dy="0">Care gaps become auditable</tspan></text><text x="163" y="793" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="163" dy="0">Only under valid obligation and coverage.</tspan></text><g filter="url(#shadow)"><rect x="590" y="715" width="420" height="110" rx="24" fill="#fff4d8" stroke="#e5ad28" stroke-width="2"/></g><rect x="590" y="715" width="12" height="110" rx="12" fill="#e5ad28" stroke="#e5ad28" stroke-width="0"/><text x="618" y="757" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="618" dy="0">Labels remain projections</tspan></text><text x="618" y="793" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="618" dy="0">Diagnosis, risk score and note never exhaust identity.</tspan></text><g filter="url(#shadow)"><rect x="1045" y="715" width="420" height="110" rx="24" fill="#eeeaf7" stroke="#7162a5" stroke-width="2"/></g><rect x="1045" y="715" width="12" height="110" rx="12" fill="#7162a5" stroke="#7162a5" stroke-width="0"/><text x="1073" y="757" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="1073" dy="0">Research reuse is gated</tspan></text><text x="1073" y="793" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="1073" dy="0">Purpose, consent, provenance and revocation are explicit.</tspan></text></svg>