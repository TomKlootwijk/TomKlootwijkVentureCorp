<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#103044"/></marker>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#103044" flood-opacity=".16"/></filter>
    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">Replacement versus addition spectrum</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">The practical program is selective: retain physical law, replace redundant materialization, add auditable event semantics</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><rect x="45" y="245" width="275" height="480" rx="28" fill="#e4f3eb" stroke="#2b9a68" stroke-width="3"/><text x="182" y="300" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#2b9a68" text-anchor="middle"><tspan x="182" dy="0">RETAIN</tspan></text><text x="182" y="345" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="182" dy="0">Irreducible physical layer</tspan></text><text x="182" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="182" dy="0">MRI magnet / gradients / RF</tspan><tspan x="182" dy="23">EUV source / optics / stages</tspan><tspan x="182" dy="23">Power electronics / actuators</tspan></text><text x="182" y="675" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#667985" text-anchor="middle"><tspan x="182" dy="0">Physics stays authoritative</tspan></text><rect x="352" y="245" width="275" height="480" rx="28" fill="#e0f3f2" stroke="#169796" stroke-width="3"/><text x="489" y="300" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#169796" text-anchor="middle"><tspan x="489" dy="0">ADD</tspan></text><text x="489" y="345" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="489" dy="0">Query and event substrate</tspan></text><text x="489" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="489" dy="0">local support</tspan><tspan x="489" dy="23">compatibility / consent</tspan><tspan x="489" dy="23">guards / absence / lineage</tspan></text><text x="489" y="675" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#667985" text-anchor="middle"><tspan x="489" dy="0">Substrate beneath systems</tspan></text><rect x="659" y="245" width="275" height="480" rx="28" fill="#fff4d8" stroke="#e5ad28" stroke-width="3"/><text x="796" y="300" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#e5ad28" text-anchor="middle"><tspan x="796" dy="0">PARTIALLY REPLACE</tspan></text><text x="796" y="345" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="796" dy="0">Bounded image/grid stage</tspan></text><text x="796" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="796" dy="0">selected reconstruction</tspan><tspan x="796" dy="23">frame polling</tspan><tspan x="796" dy="23">dense replay / broad scans</tspan></text><text x="796" y="675" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#667985" text-anchor="middle"><tspan x="796" dy="0">Only with task baseline</tspan></text><rect x="966" y="245" width="275" height="480" rx="28" fill="#eeeaf7" stroke="#7162a5" stroke-width="3"/><text x="1103" y="300" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#7162a5" text-anchor="middle"><tspan x="1103" dy="0">FRONTIER</tspan></text><text x="1103" y="345" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1103" dy="0">New instrument/kernel</tspan></text><text x="1103" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1103" dy="0">task-specific MR sensor</tspan><tspan x="1103" dy="23">photonic classifier</tspan><tspan x="1103" dy="23">event-driven ADC front end</tspan></text><text x="1103" y="675" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#667985" text-anchor="middle"><tspan x="1103" dy="0">Must earn system advantage</tspan></text><rect x="1273" y="245" width="275" height="480" rx="28" fill="#fde9e5" stroke="#de6a5b" stroke-width="3"/><text x="1410" y="300" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#de6a5b" text-anchor="middle"><tspan x="1410" dy="0">REJECT</tspan></text><text x="1410" y="345" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1410" dy="0">Unbounded promise</tspan></text><text x="1410" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1410" dy="0">zero power / zero latency</tspan><tspan x="1410" dy="23">universal replacement</tspan><tspan x="1410" dy="23">automatic medical control</tspan></text><text x="1410" y="675" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#667985" text-anchor="middle"><tspan x="1410" dy="0">Not enabled by prose</tspan></text></svg>