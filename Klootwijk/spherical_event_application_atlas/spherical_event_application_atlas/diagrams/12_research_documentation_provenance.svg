    </defs><rect width="100%" height="100%" fill="#ffffff"/><text x="80" y="85" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#103044" text-anchor="start"><tspan x="80" dy="0">Research and documentation management as executable provenance</tspan></text><text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#667985" text-anchor="start"><tspan x="80" dy="0">Documents remain human views; claims, evidence, transformations, decisions and gaps form the authoritative graph</tspan></text><line x1="80" y1="158" x2="1520" y2="158" stroke="#169796" stroke-width="5"/><rect x="75" y="235" width="290" height="170" rx="24" fill="#e0f3f2" stroke="#169796" stroke-width="3"/><text x="220" y="295" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="220" dy="0">Source</tspan></text><text x="220" y="335" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="220" dy="0">dataset / instrument /</tspan><tspan x="220" dy="20">interview / document</tspan></text><rect x="405" y="175" width="290" height="170" rx="24" fill="#fff4d8" stroke="#e5ad28" stroke-width="3"/><text x="550" y="235" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="550" dy="0">Claim</tspan></text><text x="550" y="275" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="550" dy="0">typed assertion +</tspan><tspan x="550" dy="20">scope + uncertainty</tspan></text><rect x="405" y="435" width="290" height="170" rx="24" fill="#eeeaf7" stroke="#7162a5" stroke-width="3"/><text x="550" y="495" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="550" dy="0">Method</tspan></text><text x="550" y="535" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="550" dy="0">versioned operation +</tspan><tspan x="550" dy="20">parameters</tspan></text><rect x="755" y="235" width="290" height="170" rx="24" fill="#e4f3eb" stroke="#2b9a68" stroke-width="3"/><text x="900" y="295" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="900" dy="0">Evidence</tspan></text><text x="900" y="335" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="900" dy="0">supports / contradicts /</tspan><tspan x="900" dy="20">inconclusive</tspan></text><rect x="1115" y="175" width="290" height="170" rx="24" fill="#fde9e5" stroke="#de6a5b" stroke-width="3"/><text x="1260" y="235" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1260" dy="0">Decision</tspan></text><text x="1260" y="275" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1260" dy="0">review / release /etract / revise</tspan></text><rect x="1115" y="435" width="290" height="170" rx="24" fill="#f3f7f8" stroke="#103044" stroke-width="3"/><text x="1260" y="495" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="middle"><tspan x="1260" dy="0">Expected evidence</tspan></text><text x="1260" y="535" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#203746" text-anchor="middle"><tspan x="1260" dy="0">due experiment / review /eplication / response</tspan></text><line x1="365" y1="320" x2="405" y2="280" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><line x1="365" y1="320" x2="405" y2="500" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><line x1="695" y1="260" x2="755" y2="320" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><line x1="695" y1="520" x2="755" y2="340" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><line x1="1045" y1="320" x2="1115" y2="275" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><line x1="1045" y1="320" x2="1115" y2="500" stroke="#103044" stroke-width="4" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="270" y="725" width="1060" height="100" rx="24" fill="#f3f7f8" stroke="#c8d4d9" stroke-width="2"/></g><rect x="270" y="725" width="12" height="100" rx="12" fill="#169796" stroke="#169796" stroke-width="0"/><text x="298" y="767" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#103044" text-anchor="start"><tspan x="298" dy="0">Materialized views</tspan></text><text x="298" y="803" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#203746" text-anchor="start"><tspan x="298" dy="0">paper, PDF, dashboard, registry entry and literature review are generated from the provenance graph; staleness and omissions are explicit.</tspan></text></svg>