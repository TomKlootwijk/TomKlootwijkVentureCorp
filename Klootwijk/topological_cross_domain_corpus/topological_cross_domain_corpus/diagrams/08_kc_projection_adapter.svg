<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b2538"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8b8d"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="white"/>
<title>KC projection adapter</title>
<text x="55" y="55" font-family="DejaVu Sans" font-size="34" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="start">KC Vector system as a projection adapter</text><text x="55" y="88" font-family="DejaVu Sans" font-size="20" font-weight="400" font-style="normal" fill="#51606b" text-anchor="start">A downstream path from implicit query results to screen or print</text><rect x="55" y="180" width="180" height="120" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="145.0" y="240.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="145.0" dy="0">Query result /</tspan><tspan x="145.0" dy="22.5">implicit</tspan><tspan x="145.0" dy="22.5">boundary</tspan></text><line x1="235" y1="240" x2="252" y2="240" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="180" width="180" height="120" rx="16" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="350.0" y="240.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="350.0" dy="0">Local log-polar</tspan><tspan x="350.0" dy="22.5">address</tspan></text><line x1="440" y1="240" x2="457" y2="240" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="180" width="180" height="120" rx="16" fill="#f1eef9" stroke="#6f5aa8" stroke-width="2" filter="url(#shadow)"/><text x="555.0" y="240.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="555.0" dy="0">SDF / CSG</tspan><tspan x="555.0" dy="22.5">evaluation</tspan></text><line x1="645" y1="240" x2="662" y2="240" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)"/><rect x="670" y="180" width="180" height="120" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="760.0" y="240.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="760.0" dy="0">Phase-amplitude</tspan><tspan x="760.0" dy="22.5">edge</tspan><tspan x="760.0" dy="22.5">accumulator</tspan></text><line x1="850" y1="240" x2="867" y2="240" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)"/><rect x="875" y="180" width="180" height="120" rx="16" fill="#eaf7f0" stroke="#2f8f65" stroke-width="2" filter="url(#shadow)"/><text x="965.0" y="240.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="965.0" dy="0">Quantization</tspan><tspan x="965.0" dy="22.5">policy</tspan></text><rect x="210" y="440" width="230" height="100" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="325.0" y="480.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="325.0" dy="0">Screen output</tspan></text><text x="325.0" y="516" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="325.0" dy="0">1-bit PDM + dither</tspan></text><rect x="485" y="440" width="230" height="100" rx="16" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="480.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="600.0" dy="0">Analytic/vector</tspan><tspan x="600.0" dy="27.5">output</tspan></text><text x="600.0" y="516" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="600.0" dy="0">retain curves/events</tspan></text><rect x="760" y="440" width="230" height="100" rx="16" fill="#f1eef9" stroke="#6f5aa8" stroke-width="2" filter="url(#shadow)"/><text x="875.0" y="480.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="875.0" dy="0">Print output</tspan></text><text x="875.0" y="516" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="875.0" dy="0">CMYK + blue noise + dot</tspan><tspan x="875.0" dy="21.25">gain</tspan></text><line x1="965" y1="300" x2="325" y2="440" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="965" y1="300" x2="600" y2="440" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="965" y1="300" x2="875" y2="440" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="300" y="610" width="600" height="55" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="637.5" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="600.0" dy="0">&quot;Feynman vectors&quot; normalized here as phase-</tspan><tspan x="600.0" dy="22.5">amplitude edge accumulation.</tspan></text></svg>