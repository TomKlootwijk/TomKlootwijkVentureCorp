<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b2538"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f8b8d"/></marker><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/></filter></defs><rect width="100%" height="100%" fill="white"/><title>State product space</title><text x="60" y="58" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#0b2538" text-anchor="start">State is more than position</text><text x="60" y="92" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#51606b" text-anchor="start">Normalized product space from the mature corpus reading</text><rect x="70" y="150" width="300" height="130" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="220" y="202" font-family="DejaVu Sans" font-size="36" font-weight="700" fill="#0b2538" text-anchor="middle">P^n</text><text x="220" y="238" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="220" dy="0">position / projective</tspan><tspan x="220" dy="21.96">geometry</tspan></text><rect x="430" y="150" width="300" height="130" rx="16" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="580" y="202" font-family="DejaVu Sans" font-size="36" font-weight="700" fill="#0b2538" text-anchor="middle">R</text><text x="580" y="238" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="580" dy="0">continuous time</tspan></text><rect x="790" y="150" width="300" height="130" rx="16" fill="#f1eef9" stroke="#6f5aa8" stroke-width="2" filter="url(#shadow)"/><text x="940" y="202" font-family="DejaVu Sans" font-size="36" font-weight="700" fill="#0b2538" text-anchor="middle">S^1</text><text x="940" y="238" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="940" dy="0">phase coordinate</tspan></text><rect x="70" y="325" width="300" height="130" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="220" y="377" font-family="DejaVu Sans" font-size="36" font-weight="700" fill="#0b2538" text-anchor="middle">Z2</text><text x="220" y="413" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="220" dy="0">sheet / orientation</tspan></text><rect x="430" y="325" width="300" height="130" rx="16" fill="#eaf7f0" stroke="#2f8f65" stroke-width="2" filter="url(#shadow)"/><text x="580" y="377" font-family="DejaVu Sans" font-size="36" font-weight="700" fill="#0b2538" text-anchor="middle">A</text><text x="580" y="413" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="580" dy="0">lineage address</tspan></text><rect x="790" y="325" width="300" height="130" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="940" y="377" font-family="DejaVu Sans" font-size="36" font-weight="700" fill="#0b2538" text-anchor="middle">B</text><text x="940" y="413" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="940" dy="0">branch / version</tspan></text><rect x="105" y="515" width="990" height="80" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="600" y="552" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#0b2538" text-anchor="middle">Q = P^n x R_time x S^1_phase x Z2_sheet x A_address x B_branch</text><text x="600" y="582" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#51606b" text-anchor="middle">Entity state: where, when, phase, sector, lineage, branch, and a narrow route bit.</text><text x="600" y="650" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#0f8b8d" text-anchor="middle">Images, meshes, and frames are views derived from Q.</text></svg>