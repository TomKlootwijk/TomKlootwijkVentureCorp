<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b2538"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8b8d"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="white"/>
<title>Interpretive shift from projection-first to query-first</title>
<text x="60" y="58" font-family="DejaVu Sans" font-size="34" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="start">The decisive interpretive shift</text><text x="60" y="91" font-family="DejaVu Sans" font-size="20" font-weight="400" font-style="normal" fill="#51606b" text-anchor="start">The corpus is not primarily a chemistry decoder or a renderer proposal.</text><rect x="70" y="145" width="450" height="80" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="295.0" y="185.0" font-family="DejaVu Sans" font-size="25" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="295.0" dy="0">Projection-first reading</tspan></text><rect x="130" y="260" width="330" height="65" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="295.0" y="292.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="295.0" dy="0">Store geometry / grids</tspan></text><line x1="295" y1="325" x2="295" y2="357" stroke="#d95d4f" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="365" width="330" height="65" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="295.0" y="397.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="295.0" dy="0">Advance global frames</tspan></text><line x1="295" y1="430" x2="295" y2="462" stroke="#d95d4f" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="470" width="330" height="65" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="295.0" y="502.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="295.0" dy="0">Rasterize or march</tspan></text><line x1="295" y1="535" x2="295" y2="567" stroke="#d95d4f" stroke-width="3" marker-end="url(#arrow)"/><rect x="130" y="575" width="330" height="65" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="295.0" y="607.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="295.0" dy="0">Treat pixels as world truth</tspan></text><line x1="88" y1="245" x2="500" y2="650" stroke="#d95d4f" stroke-width="8" opacity="0.45"/><rect x="680" y="145" width="450" height="80" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="905.0" y="185.0" font-family="DejaVu Sans" font-size="25" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="905.0" dy="0">Query-first reading</tspan></text><rect x="740" y="260" width="330" height="65" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="905.0" y="292.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="905.0" dy="0">Finite grammar + exogenous</tspan><tspan x="905.0" dy="23.75">log</tspan></text><line x1="905" y1="325" x2="905" y2="357" stroke="#0f8b8d" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="740" y="365" width="330" height="65" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="905.0" y="397.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="905.0" dy="0">Directly queryable state</tspan><tspan x="905.0" dy="23.75">manifold</tspan></text><line x1="905" y1="430" x2="905" y2="462" stroke="#0f8b8d" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="740" y="470" width="330" height="65" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="905.0" y="502.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="905.0" dy="0">Support + compatibility +</tspan><tspan x="905.0" dy="23.75">event solve</tspan></text><line x1="905" y1="535" x2="905" y2="567" stroke="#0f8b8d" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="740" y="575" width="330" height="65" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="905.0" y="607.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="905.0" dy="0">Optional image, vector,</tspan><tspan x="905.0" dy="23.75">print, or hardware view</tspan></text><text x="600" y="675" font-family="DejaVu Sans" font-size="22" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="middle">Authority flows from state to projection, not projection to state.</text></svg>