<title>Equation World Zero</title>
<text x="55" y="55" font-family="DejaVu Sans" font-size="34" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="start">Equation World Zero</text><text x="55" y="88" font-family="DejaVu Sans" font-size="20" font-weight="400" font-style="normal" fill="#51606b" text-anchor="start">Restricted, headless, falsifiable prototype</text><rect x="38" y="160" width="170" height="90" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="123.0" y="205.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="123.0" dy="0">Seed + grammar</tspan></text><line x1="208" y1="205" x2="226" y2="205" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="231" y="160" width="170" height="90" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="316.0" y="205.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="316.0" dy="0">State</tspan><tspan x="316.0" dy="22.5">evaluator</tspan></text><line x1="401" y1="205" x2="419" y2="205" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="424" y="160" width="170" height="90" rx="16" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="509.0" y="205.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="509.0" dy="0">Compatibility</tspan><tspan x="509.0" dy="22.5">filter</tspan></text><line x1="594" y1="205" x2="612" y2="205" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="617" y="160" width="170" height="90" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="702.0" y="205.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="702.0" dy="0">Certified root</tspan><tspan x="702.0" dy="22.5">solver</tspan></text><line x1="787" y1="205" x2="805" y2="205" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="810" y="160" width="170" height="90" rx="16" fill="#f1eef9" stroke="#6f5aa8" stroke-width="2" filter="url(#shadow)"/><text x="895.0" y="205.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="895.0" dy="0">Transition</tspan><tspan x="895.0" dy="22.5">router</tspan></text><line x1="980" y1="205" x2="998" y2="205" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1003" y="160" width="170" height="90" rx="16" fill="#eaf7f0" stroke="#2f8f65" stroke-width="2" filter="url(#shadow)"/><text x="1088.0" y="205.0" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="1088.0" dy="0">Lineage + log</tspan></text><text x="600" y="330" font-family="DejaVu Sans" font-size="25" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="middle">Six required queries</text><rect x="75" y="370" width="310" height="65" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="230.0" y="402.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="230.0" dy="0">state_at(t)</tspan></text><rect x="445" y="370" width="310" height="65" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="402.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="600.0" dy="0">next_event</tspan></text><rect x="815" y="370" width="310" height="65" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="970.0" y="402.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="970.0" dy="0">events_in_support</tspan></text><rect x="75" y="460" width="310" height="65" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="230.0" y="492.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="230.0" dy="0">can_couple</tspan></text><rect x="445" y="460" width="310" height="65" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="492.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="600.0" dy="0">apply_transition</tspan></text><rect x="815" y="460" width="310" height="65" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="970.0" y="492.5" font-family="DejaVu Sans" font-size="19" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="970.0" dy="0">reconstruct_identity</tspan></text><rect x="245" y="575" width="710" height="70" rx="16" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="610.0" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="600.0" dy="0">Exit criterion: compatibility + event solving must beat the</tspan><tspan x="600.0" dy="26.25">materialization avoided.</tspan></text><text x="600" y="675" font-family="DejaVu Sans" font-size="18" font-weight="700" font-style="normal" fill="#d95d4f" text-anchor="middle">No universal O(1), zero memory, zero heat, or renderer-first success criterion.</text></svg>