<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b2538"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8b8d"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="white"/>
<title>Quad hourglass router</title>
<text x="55" y="55" font-family="DejaVu Sans" font-size="34" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="start">Quad hourglass as a routing visualization</text><text x="55" y="88" font-family="DejaVu Sans" font-size="20" font-weight="400" font-style="normal" fill="#51606b" text-anchor="start">Four sectors, one event locus, explicit parity and transition rules.</text><polygon points="600,365 250,145 520,145" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="3" filter="url(#shadow)"/><text x="456.6666666666667" y="218.33333333333334" font-family="DejaVu Sans" font-size="28" font-weight="700" font-style="normal" fill="#0f8b8d" text-anchor="middle">A0</text><polygon points="600,365 680,145 950,145" fill="#fff7df" stroke="#d8a21b" stroke-width="3" filter="url(#shadow)"/><text x="743.3333333333334" y="218.33333333333334" font-family="DejaVu Sans" font-size="28" font-weight="700" font-style="normal" fill="#d8a21b" text-anchor="middle">A1</text><polygon points="600,365 250,585 520,585" fill="#f1eef9" stroke="#6f5aa8" stroke-width="3" filter="url(#shadow)"/><text x="456.6666666666667" y="511.6666666666667" font-family="DejaVu Sans" font-size="28" font-weight="700" font-style="normal" fill="#6f5aa8" text-anchor="middle">B0</text><polygon points="600,365 680,585 950,585" fill="#fff0ed" stroke="#d95d4f" stroke-width="3" filter="url(#shadow)"/><text x="743.3333333333334" y="511.6666666666667" font-family="DejaVu Sans" font-size="28" font-weight="700" font-style="normal" fill="#d95d4f" text-anchor="middle">B1</text><line x1="600" y1="105" x2="600" y2="625" stroke="#0b2538" stroke-width="5"/><text x="620" y="125" font-family="DejaVu Sans" font-size="18" font-weight="600" font-style="normal" fill="#0b2538" text-anchor="start">invariant axis / mode</text><circle cx="600" cy="365" r="44" fill="#0b2538" stroke="#ffffff" stroke-width="5"/><text x="600" y="359" font-family="DejaVu Sans" font-size="20" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">B=0</text><text x="600" y="385" font-family="DejaVu Sans" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="middle">pinch</text><path d="M 350 360 A 250 250 0 0 1 620 120" fill="none" stroke="#d8a21b" stroke-width="5" marker-end="url(#arrow)"/><text x="340" y="340" font-family="DejaVu Sans" font-size="18" font-weight="600" font-style="normal" fill="#d8a21b" text-anchor="start">phase-controlled sweep</text><path d="M 505 270 Q 555 330 600 365 Q 665 420 720 505" fill="none" stroke="#2f8f65" stroke-width="6" marker-end="url(#arrow-teal)"/><text x="815" y="490" font-family="DejaVu Sans" font-size="22" font-weight="700" font-style="normal" fill="#2f8f65" text-anchor="start">p &lt;- NOT p</text><text x="600" y="675" font-family="DejaVu Sans" font-size="21" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="middle">The figure organizes routing; it is not a literal topology or physics proof.</text></svg>