<title>Hollowlens bridge</title>
<text x="55" y="55" font-family="DejaVu Sans" font-size="34" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="start">Optional physical bridge: Hollowlens-0</text><text x="55" y="88" font-family="DejaVu Sans" font-size="20" font-weight="400" font-style="normal" fill="#51606b" text-anchor="start">Bounded optofluidic implementation of the event calculus</text><rect x="45" y="190" width="195" height="120" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="142.5" y="240.0" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="142.5" dy="0">Local spherical</tspan><tspan x="142.5" dy="23.75">support</tspan></text><text x="142.5" y="286" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="142.5" dy="0">r, theta, phi</tspan></text><line x1="240" y1="250" x2="260" y2="250" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)"/><rect x="275" y="190" width="195" height="120" rx="16" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="372.5" y="240.0" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="372.5" dy="0">Tunable liquid</tspan><tspan x="372.5" dy="23.75">coupler</tspan></text><text x="372.5" y="286" font-family="DejaVu Sans" font-size="14" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="372.5" dy="0">curvature / n_eff /</tspan><tspan x="372.5" dy="17.5">phase</tspan></text><line x1="470" y1="250" x2="490" y2="250" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)"/><rect x="505" y="190" width="195" height="120" rx="16" fill="#f1eef9" stroke="#6f5aa8" stroke-width="2" filter="url(#shadow)"/><text x="602.5" y="240.0" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="602.5" dy="0">2x2</tspan><tspan x="602.5" dy="23.75">interferometer</tspan></text><tex