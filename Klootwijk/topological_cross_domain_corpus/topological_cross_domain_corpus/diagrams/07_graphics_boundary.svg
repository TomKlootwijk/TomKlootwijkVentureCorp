<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b2538"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f8b8d"/></marker><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/></filter></defs><rect width="100%" height="100%" fill="white"/><title>Computer graphics boundary</title><text x="55" y="55" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#0b2538" text-anchor="start">Computer graphics: core versus projection</text><text x="55" y="88" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#51606b" text-anchor="start">The corpus overlaps with graphics without reducing the world to drawing.</text><rect x="80" y="145" width="455" height="425" rx="24" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><rect x="665" y="145" width="455" height="425" rx="24" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="307" y="190" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#0f8b8d" text-anchor="middle">Authoritative query substrate</text><text x="892" y="190" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#d8a21b" text-anchor="middle">Downstream projections</text><rect x="145" y="215" width="325" height="36" rx="9" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="307" y="240" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">finite grammar</text><rect x="145" y="258" width="325" height="36" rx="9" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="307" y="283" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">state manifold</text><rect x="145" y="301" width="325" height="36" rx="9" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="307" y="326" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">implicit relations</text><rect x="145" y="344" width="325" height="36" rx="9" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="307" y="369" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">local supports</text><rect x="145" y="387" width="325" height="36" rx="9" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="307" y="412" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">compatibility</text><rect x="145" y="430" width="325" height="36" rx="9" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="307" y="455" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">event solver</text><rect x="145" y="473" width="325" height="36" rx="9" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="307" y="498" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">transitions</text><rect x="145" y="516" width="325" height="36" rx="9" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="307" y="541" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">lineage + log</text><rect x="730" y="215" width="325" height="36" rx="9" fill="#ffffff" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="892" y="240" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">rasterization</text><rect x="730" y="258" width="325" height="36" rx="9" fill="#ffffff" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="892" y="283" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">raymarching</text><rect x="730" y="301" width="325" height="36" rx="9" fill="#ffffff" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="892" y="326" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">ray tracing</text><rect x="730" y="344" width="325" height="36" rx="9" fill="#ffffff" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="892" y="369" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">vector output</text><rect x="730" y="387" width="325" height="36" rx="9" fill="#ffffff" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="892" y="412" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">volumetric display</text><rect x="730" y="430" width="325" height="36" rx="9" fill="#ffffff" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="892" y="455" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">screen PDM / dither</text><rect x="730" y="473" width="325" height="36" rx="9" fill="#ffffff" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="892" y="498" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">print / prepress</text><rect x="730" y="516" width="325" height="36" rx="9" fill="#ffffff" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="892" y="541" font-family="DejaVu Sans" font-size="16" font-weight="600" fill="#0b2538" text-anchor="middle">optofluidic readout</text><line x1="535" y1="345" x2="665" y2="345" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="326" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#0b2538" text-anchor="middle">query result</text><line x1="665" y1="390" x2="535" y2="390" stroke="#d95d4f" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 7"/><text x="600" y="425" font-family="DejaVu Sans" font-size="15" font-weight="600" fill="#d95d4f" text-anchor="middle">no authority feedback</text><text x="600" y="645" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#0b2538" text-anchor="middle">Do not mistake the projector for the state space.</text></svg>