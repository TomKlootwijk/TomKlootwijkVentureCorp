<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0b2538"/></marker>
  <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0f8b8d"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="white"/>
<title>Double vacuum as relational exclusion</title>
<text x="55" y="55" font-family="DejaVu Sans" font-size="34" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="start">Double vacuum = same coordinate, different sector</text><text x="55" y="88" font-family="DejaVu Sans" font-size="20" font-weight="400" font-style="normal" fill="#51606b" text-anchor="start">The second vacuum is absence of coupling, not stronger emptiness.</text><rect x="110" y="175" width="980" height="130" rx="24" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="3"/><rect x="110" y="410" width="980" height="130" rx="24" fill="#f1eef9" stroke="#6f5aa8" stroke-width="3"/><text x="140" y="215" font-family="DejaVu Sans" font-size="24" font-weight="700" font-style="normal" fill="#0f8b8d" text-anchor="start">Sheet A / sector 0</text><text x="140" y="450" font-family="DejaVu Sans" font-size="24" font-weight="700" font-style="normal" fill="#6f5aa8" text-anchor="start">Sheet B / sector 1</text><line x1="600" y1="135" x2="600" y2="585" stroke="#0b2538" stroke-width="2" stroke-dasharray="9 8"/><text x="620" y="155" font-family="DejaVu Sans" font-size="18" font-weight="600" font-style="normal" fill="#51606b" text-anchor="start">same spatial x</text><circle cx="600" cy="250" r="34" fill="#0f8b8d"/><circle cx="600" cy="485" r="34" fill="#6f5aa8"/><text x="600" y="257" font-family="DejaVu Sans" font-size="18" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">eA</text><text x="600" y="492" font-family="DejaVu Sans" font-size="18" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle">eB</text><line x1="638" y1="250" x2="638" y2="450" stroke="#d95d4f" stroke-width="4" marker-end="url(#arrow)" stroke-dasharray="10 8"/><line x1="620" y1="330" x2="656" y2="370" stroke="#d95d4f" stroke-width="7"/><line x1="656" y1="330" x2="620" y2="370" stroke="#d95d4f" stroke-width="7"/><rect x="760" y="300" width="270" height="95" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="895.0" y="337.5" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="895.0" dy="0">chi = 0</tspan></text><text x="895.0" y="371" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="895.0" dy="0">no coupling despite co-</tspan><tspan x="895.0" dy="28.75">location</tspan></text><rect x="135" y="315" width="250" height="90" rx="16" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="260.0" y="350.0" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="260.0" dy="0">Compatibility gate</tspan></text><text x="260.0" y="381" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="260.0" dy="0">sheet + phase + address +</tspan><tspan x="260.0" dy="22.5">policy</tspan></text><line x1="385" y1="360" x2="545" y2="360" stroke="#d8a21b" stroke-width="3" marker-end="url(#arrow)"/><rect x="465" y="615" width="270" height="55" rx="16" fill="#eaf7f0" stroke="#2f8f65" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="642.5" font-family="DejaVu Sans" font-size="18" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="600.0" dy="0">When chi = 1, an event</tspan><tspan x="600.0" dy="22.5">may compute.</tspan></text></svg>