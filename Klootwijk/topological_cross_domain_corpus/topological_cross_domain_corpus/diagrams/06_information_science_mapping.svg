<rect width="100%" height="100%" fill="white"/>
<title>Information science mapping</title>
<text x="55" y="55" font-family="DejaVu Sans" font-size="34" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="start">Information-science normal form</text><text x="55" y="88" font-family="DejaVu Sans" font-size="20" font-weight="400" font-style="normal" fill="#51606b" text-anchor="start">Alchemical/topological vocabulary translated into data architecture roles</text><rect x="65" y="135" width="340" height="55" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="235.0" y="162.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="235.0" dy="0">finite grammar</tspan></text><line x1="405" y1="162" x2="535" y2="162" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="535" y="135" width="595" height="55" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="832.5" y="162.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="832.5" dy="0">generative schema / program</tspan></text><rect x="65" y="201" width="340" height="55" rx="16" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="235.0" y="228.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="235.0" dy="0">relations</tspan></text><line x1="405" y1="228" x2="535" y2="228" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="535" y="201" width="595" height="55" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="832.5" y="228.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="832.5" dy="0">declarative constraints</tspan></text><rect x="65" y="267" width="340" height="55" rx="16" fill="#f1eef9" stroke="#6f5aa8" stroke-width="2" filter="url(#shadow)"/><text x="235.0" y="294.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="235.0" dy="0">exogenous log</tspan></text><line x1="405" y1="294" x2="535" y2="294" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="535" y="267" width="595" height="55" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="832.5" y="294.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="832.5" dy="0">event sourcing</tspan></text><rect x="65" y="333" width="340" height="55" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="235.0" y="360.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="235.0" dy="0">lineage address</tspan></text><line x1="405" y1="360" x2="535" y2="360" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="535" y="333" width="595" height="55" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="832.5" y="360.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="832.5" dy="0">provenance key</tspan></text><rect x="65" y="399" width="340" height="55" rx="16" fill="#eaf7f0" stroke="#2f8f65" stroke-width="2" filter="url(#shadow)"/><text x="235.0" y="426.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="235.0" dy="0">phase sheet</tspan></text><line x1="405" y1="426" x2="535" y2="426" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="535" y="399" width="595" height="55" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="832.5" y="426.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="832.5" dy="0">namespace / trust context</tspan></text><rect x="65" y="465" width="340" height="55" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="235.0" y="492.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="235.0" dy="0">compatibility</tspan></text><line x1="405" y1="492" x2="535" y2="492" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="535" y="465" width="595" height="55" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="832.5" y="492.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="832.5" dy="0">join + access predicate</tspan></text><rect x="65" y="531" width="340" height="55" rx="16" fill="#f1eef9" stroke="#6f5aa8" stroke-width="2" filter="url(#shadow)"/><text x="235.0" y="558.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="235.0" dy="0">branch</tspan></text><line x1="405" y1="558" x2="535" y2="558" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="535" y="531" width="595" height="55" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="832.5" y="558.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="832.5" dy="0">version / counterfactual</tspan></text><rect x="65" y="597" width="340" height="55" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="235.0" y="624.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="235.0" dy="0">projection</tspan></text><line x1="405" y1="624" x2="535" y2="624" stroke="#0b2538" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="535" y="597" width="595" height="55" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="832.5" y="624.5" font-family="DejaVu Sans" font-size="18" font-weight="600" fill="#13212a" text-anchor="middle"><tspan x="832.5" dy="0">materialized view</tspan></text><text x="600" y="685" font-family="DejaVu Sans" font-size="18" font-weight="600" font-style="normal" fill="#51606b" text-anchor="middle">The mapping is an interpretive normalization, not an external replacement of the source.</text></svg>