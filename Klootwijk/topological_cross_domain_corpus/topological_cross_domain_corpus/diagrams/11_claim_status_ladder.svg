<rect width="100%" height="100%" fill="white"/>
<title>Claim status ladder</title>
<text x="55" y="55" font-family="DejaVu Sans" font-size="34" font-weight="700" font-style="normal" fill="#0b2538" text-anchor="start">Claim discipline used in the new report</text><text x="55" y="88" font-family="DejaVu Sans" font-size="20" font-weight="400" font-style="normal" fill="#51606b" text-anchor="start">Keep useful operators; separate source definition from validation.</text><rect x="110" y="150" width="980" height="95" rx="16" fill="#eaf7f0" stroke="#2f8f65" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="187.5" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="600.0" dy="0">RETAIN</tspan></text><text x="600.0" y="221" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="600.0" dy="0">queryable state/event core; local support; compatibility; lineage</tspan></text><rect x="160" y="280" width="880" height="95" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="317.5" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="600.0" dy="0">TRANSLATE</tspan></text><text x="600.0" y="351" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="600.0" dy="0">double vacuum -&gt; uncoupled sectors; matrix-in-glass -&gt; transfer matrix</tspan></text><rect x="220" y="410" width="760" height="95" rx="16" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="447.5" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="600.0" dy="0">DEMOTE</tspan></text><text x="600.0" y="481" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="600.0" dy="0">Klein bottle -&gt; explicit gluing map; golden ratio -&gt; optional schedule</tspan></text><rect x="280" y="540" width="640" height="95" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="577.5" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#13212a" text-anchor="middle"><tspan x="600.0" dy="0">REJECT</tspan></text><text x="600.0" y="611" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="600.0" dy="0">universal O(1); zero memory/heat/latency; literal immunity;</tspan><tspan x="600.0" dy="25.0">medical control</tspan></text></svg>