<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b2538"/></marker><marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0f8b8d"/></marker><filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/></filter></defs><rect width="100%" height="100%" fill="white"/><title>Source roles</title><text x="55" y="55" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#0b2538" text-anchor="start">Seven-document source architecture</text><text x="55" y="88" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#51606b" text-anchor="start">Generative prose is normalized by later interpretive and engineering discipline.</text><rect x="95" y="210" width="190" height="110" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="190" y="256" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#0b2538" text-anchor="middle">S3</text><text x="190" y="286" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="190" dy="0">optics, sieve, jitter</tspan></text><rect x="300" y="135" width="190" height="110" rx="16" fill="#f1eef9" stroke="#6f5aa8" stroke-width="2" filter="url(#shadow)"/><text x="395" y="181" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#0b2538" text-anchor="middle">S2</text><text x="395" y="211" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="395" dy="0">double vacuum,</tspan><tspan x="395" dy="19.52">hourglass</tspan></text><rect x="505" y="115" width="190" height="110" rx="16" fill="#fff7df" stroke="#d8a21b" stroke-width="2" filter="url(#shadow)"/><text x="600" y="161" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#0b2538" text-anchor="middle">S4</text><text x="600" y="191" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="600" dy="0">hinge, overlap, zero</tspan><tspan x="600" dy="19.52">index</tspan></text><rect x="710" y="135" width="190" height="110" rx="16" fill="#fff0ed" stroke="#d95d4f" stroke-width="2" filter="url(#shadow)"/><text x="805" y="181" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#0b2538" text-anchor="middle">S5</text><text x="805" y="211" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="805" dy="0">cross-domain</tspan><tspan x="805" dy="19.52">consolidation</tspan></text><rect x="915" y="210" width="190" height="110" rx="16" fill="#eaf7f0" stroke="#2f8f65" stroke-width="2" filter="url(#shadow)"/><text x="1010" y="256" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#0b2538" text-anchor="middle">S7</text><text x="1010" y="286" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="1010" dy="0">graphics projection</tspan><tspan x="1010" dy="19.52">adapter</tspan></text><line x1="190" y1="320" x2="490" y2="435" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><line x1="395" y1="245" x2="490" y2="435" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><line x1="600" y1="225" x2="490" y2="435" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><line x1="805" y1="245" x2="490" y2="435" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><line x1="1010" y1="320" x2="490" y2="435" stroke="#0b2538" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><rect x="385" y="435" width="230" height="115" rx="16" fill="#f3f5f6" stroke="#0b2538" stroke-width="2" filter="url(#shadow)"/><text x="500" y="477" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#0b2538" text-anchor="middle">S1</text><text x="500" y="508" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="500" dy="0">mature interpretive</tspan><tspan x="500" dy="19.52">synthesis</tspan></text><rect x="720" y="435" width="230" height="115" rx="16" fill="#e7f5f5" stroke="#0f8b8d" stroke-width="2" filter="url(#shadow)"/><text x="835" y="477" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#0b2538" text-anchor="middle">S6</text><text x="835" y="508" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#51606b" text-anchor="middle"><tspan x="835" dy="0">bounded hardware</tspan><tspan x="835" dy="19.52">translation</tspan></text><line x1="615" y1="492" x2="720" y2="492" stroke="#0f8b8d" stroke-width="3" marker-end="url(#arrow-teal)"/><text x="600" y="610" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#0b2538" text-anchor="middle">Interpretation authority</text><text x="600" y="647" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#0f8b8d" text-anchor="middle">S1 normalizes the ontology; S6 normalizes the physical embodiment.</text></svg>